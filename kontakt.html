<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt & støtte - Drømmehaven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/829d5199ff.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Header/Navbar -->
    <header>
        <nav class="navbar" aria-label="Hovedmenu"> 
            <div class="logo">
                 <i class="fa-regular fa-moon"></i>
                <span>Drømmehaven</span>
            </div>
            
            <div class="burger-menu" id="burger">
                <i class="fa-solid fa-bars"></i>
            </div>

            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Forside</a></li>
                <li><a href="mental-sundhed.html">Mental sundhed</a></li>
                <li><a href="kontakt.html">Mental sundhed</a></li>
                
            </ul>
        </nav>
    </header>

    <!-- Indhold for Kontakt & støtte -->
    <main class="kontakt-indhold">
        <div class="kontakt-header">
            <h1>Kontakt & støtte</h1>
            <p>Du er ikke alene. Her kan du række ud – helt uforpligtende.</p>
        </div>

        <div class="kontakt-grid">
            <!-- Venstre side (Ring/Info boks) -->
            <div class="kontakt-info-boks">
                <div class="info-item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h3>Ring til os</h3>
                        <p class="telefon-nr">+45 28688782</p>
                    </div>
                </div>
                <p class="info-tekst">Har du brug for nogen at tale med her og nu? Vores linjer er åbne, og vi sidder klar til at lytte.</p>
            </div>

            <!-- Højre side (Skriv til os) -->
            <div class="kontakt-form-boks">
                <h2>Skriv til os</h2>
                <form>
                    <div class="form-gruppe">
                        <label for="navn">Navn</label>
                        <input type="text" id="navn" placeholder="Skriv dit navn her...">
                    </div>

                    <div class="form-gruppe">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Skriv din e-mail her...">
                    </div>

                    <div class="form-gruppe">
                        <label for="besked">Besked</label>
                        <textarea id="besked" rows="4" placeholder="Skriv hvad du tænker på..."></textarea>
                    </div>

                    <button type="submit" class="cta-knap">Send besked</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Burgermenu -->
    <script>
        const burger = document.getElementById('burger');
        const navLinks = document.getElementById('nav-links');

        burger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
